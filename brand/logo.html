<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syncopate:wght@400;700&family=Michroma&display=swap" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } svg { display: block; }</style>
</head>
<body>
<svg id="s" width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ccd2"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="1000" height="1000" fill="#000"/>
  <g id="mark"></g>
  <g id="word"></g>
</svg>
<script>
const Q = new URLSearchParams(location.search)
const V = Q.get('v') || 'a'
const NS = 'http://www.w3.org/2000/svg'
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e }
const mark = document.getElementById('mark'), word = document.getElementById('word')

// --- the mark: the city's landmark as a monoline drawing. Ground at y = G, centred on x = 500.
const S = +(Q.get('scale') || 1), G = 470, cx = 500, B = +(Q.get('bold') || 1)
const tiers = [[78, 118], [62, 196], [48, 252], [34, 286]]        // [width, height above ground]
const g = el('g', { transform: `translate(${cx} ${G}) scale(${S}) translate(${-cx} ${-G})` }, mark)
// horizon: a hairline that fades out both ways
el('rect', { x: 260, y: G - .6 * B, width: 480, height: 1.2 * B, fill: 'url(#horizon)' }, g)
// silhouette: one stepped outline
let pts = []
const L = tiers.map(([w, h]) => [cx - w / 2, G - h]), R = tiers.map(([w, h]) => [cx + w / 2, G - h])
pts.push([L[0][0], G])
tiers.forEach(([w, h], i) => { pts.push([cx - w / 2, G - h]); if (i < tiers.length - 1) pts.push([cx - tiers[i + 1][0] / 2, G - h]) })
for (let i = tiers.length - 1; i >= 0; i--) { const [w, h] = tiers[i]; if (i < tiers.length - 1) pts.push([cx + tiers[i + 1][0] / 2, G - h]); pts.push([cx + w / 2, G - h]) }
pts.push([R[0][0], G])
el('polyline', { points: pts.map((p) => p.join(',')).join(' '), fill: '#000', stroke: '#fff', 'stroke-width': 2.2 * B, 'stroke-linejoin': 'miter' }, g)
// floors: fine hairlines inside each tier
tiers.forEach(([w, h], i) => {
  const lo = i ? G - tiers[i - 1][1] : G, hi = G - h
  for (let y = lo - 10; y > hi + 5; y -= 10) el('rect', { x: cx - w / 2 + 6, y, width: w - 12, height: .9 * Math.sqrt(B), fill: '#fff', opacity: .26 + .06 * (B - 1) }, g)
})
// a vertical centre seam
el('rect', { x: cx - .45, y: G - tiers[3][1], width: .9, height: tiers[3][1] - 4, fill: '#fff', opacity: .16 }, g)
// the lit crown: the top floors glow white
const [cw, ch] = tiers[3]
el('rect', { x: cx - cw / 2 + 4, y: G - ch + 4, width: cw - 8, height: 24, fill: 'url(#silver)' }, g)
el('ellipse', { cx, cy: G - ch + 14, rx: 70, ry: 46, fill: 'url(#glow)' }, g)
// spire + beacon
el('rect', { x: cx - 1.1 * B, y: G - ch - 64, width: 2.2 * B, height: 64, fill: '#fff' }, g)
el('circle', { cx, cy: G - ch - 68, r: 18, fill: 'url(#glow)' }, g)
el('circle', { cx, cy: G - ch - 68, r: 3.8 * Math.sqrt(B), fill: '#fff' }, g)

// --- the wordmark, centred under the mark
const Y = +(Q.get('y') || 575)
if (V === 'a') {          // Inter, wide-tracked: quiet and expensive
  el('text', { x: 500, y: Y, 'text-anchor': 'middle', fill: '#fff', 'font-family': 'Inter', 'font-weight': 500, 'font-size': 54, 'letter-spacing': 23 }, word).textContent = 'TRENCH CITY'
} else if (V === 'b') {   // Syncopate: TRENCH bold, CITY light
  const t = el('text', { x: 500, y: Y, 'text-anchor': 'middle', fill: '#fff', 'font-family': 'Syncopate', 'font-size': +(Q.get('fs') || 64), 'letter-spacing': 12 }, word)
  el('tspan', { 'font-weight': 700 }, t).textContent = 'TRENCH '
  el('tspan', { 'font-weight': 400, opacity: .78 }, t).textContent = 'CITY'
} else {                  // Michroma: architectural, wide
  el('text', { x: 500, y: Y, 'text-anchor': 'middle', fill: '#fff', 'font-family': 'Michroma', 'font-size': +(Q.get('fs') || 58), 'letter-spacing': 16 }, word).textContent = 'TRENCH CITY'
}
// optional small line under the wordmark
if (Q.get('sub')) el('text', { x: 500, y: Y + 44, 'text-anchor': 'middle', fill: '#fff', opacity: .5, 'font-family': 'Inter', 'font-weight': 400, 'font-size': 15, 'letter-spacing': 7 }, word).textContent = Q.get('sub')
// centre the whole lockup vertically
document.fonts.ready.then(() => {
  const all = document.getElementById('s'), bb = { top: Infinity, bot: -Infinity }
  for (const n of [mark, word]) { const b = n.getBBox(); bb.top = Math.min(bb.top, b.y); bb.bot = Math.max(bb.bot, b.y + b.height) }
  const dy = 500 - (bb.top + bb.bot) / 2
  mark.setAttribute('transform', `translate(0 ${dy})`); word.setAttribute('transform', `translate(0 ${dy})`)
  window.READY = true
})
</script>
</body>
</html>
